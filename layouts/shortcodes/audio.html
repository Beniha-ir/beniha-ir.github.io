<figure {{ with .Get "class" }}class="{{ . }}" {{ end }}>
	<audio controls preload="{{ .Get " preload" | default "metadata" }}" width="200%">
		{{ with .Get "src" }}
		<source src="{{ . | relURL }}" type="audio/mpeg">
		{{ end }}
	</audio>
	{{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
